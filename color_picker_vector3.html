<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vector3 Color Picker</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0d0f12;
    --panel: #15181d;
    --panel-2: #1b1f26;
    --border: #2b313a;
    --text: #f2f4f7;
    --muted: #9299a5;
    --accent: #ffffff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:
      radial-gradient(circle at top, #171a20 0%, transparent 45%),
      var(--bg);
    color: var(--text);
  }

  .card {
    width: min(560px, 100%);
    background: rgba(21, 24, 29, 0.96);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 24px;
    box-shadow: 0 24px 70px rgba(0,0,0,.35);
  }

  h1 {
    margin: 0 0 6px;
    font-size: 22px;
    letter-spacing: -0.02em;
  }

  .subtitle {
    margin: 0 0 22px;
    color: var(--muted);
    font-size: 13px;
  }

  .picker-row {
    display: grid;
    grid-template-columns: 140px 1fr;
    gap: 18px;
    align-items: stretch;
  }

  .preview {
    min-height: 170px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,.08);
    background: #ff0000;
    position: relative;
    overflow: hidden;
  }

  .preview::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,.16), transparent 40%);
    pointer-events: none;
  }

  .native-picker {
    width: 100%;
    height: 100%;
    min-height: 170px;
    border: 0;
    padding: 0;
    background: transparent;
    cursor: pointer;
    opacity: 0;
    position: absolute;
    inset: 0;
  }

  .picker-hint {
    position: absolute;
    bottom: 12px;
    left: 12px;
    right: 12px;
    padding: 8px 10px;
    border-radius: 9px;
    background: rgba(0,0,0,.42);
    backdrop-filter: blur(8px);
    font-size: 11px;
    text-align: center;
    pointer-events: none;
  }

  .values {
    display: grid;
    gap: 10px;
  }

  .field {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 11px;
    padding: 11px 12px;
  }

  .label {
    display: block;
    margin-bottom: 4px;
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .08em;
  }

  .value {
    width: 100%;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--text);
    font: 600 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  .vector-box {
    margin-top: 18px;
    padding: 15px;
    border-radius: 12px;
    background: #0b0d10;
    border: 1px solid var(--border);
  }

  .vector-line {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .vector {
    flex: 1;
    overflow-x: auto;
    white-space: nowrap;
    font: 700 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  .vector-input {
    padding: 0;
    min-width: 0;
  }

  .result-line {
    margin-top: 12px;
  }

  .input-hint {
    margin-top: 10px;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.5;
  }

  .input-hint code {
    color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  button {
    border: 1px solid var(--border);
    border-radius: 9px;
    background: #1b2027;
    color: var(--text);
    padding: 9px 12px;
    cursor: pointer;
    font-weight: 600;
  }

  button:hover { background: #222831; }
  button:active { transform: translateY(1px); }

  .footer {
    margin-top: 14px;
    display: flex;
    justify-content: space-between;
    gap: 10px;
    color: var(--muted);
    font-size: 11px;
  }

  .dot {
    width: 8px;
    height: 8px;
    display: inline-block;
    border-radius: 50%;
    background: #64d88b;
    margin-right: 6px;
  }

  @media (max-width: 520px) {
    .picker-row { grid-template-columns: 1fr; }
    .preview { min-height: 140px; }
    .native-picker { min-height: 140px; }
  }
</style>
</head>
<body>
  <main class="card">
    <h1>Vector3 Color Picker</h1>
    <p class="subtitle">Escolha uma cor e copie o resultado diretamente como <code>Vector3</code>.</p>

    <section class="picker-row">
      <div class="preview" id="preview">
        <input class="native-picker" id="colorPicker" type="color" value="#ff0000" aria-label="Escolher cor" />
        <div class="picker-hint">Clique para escolher a cor</div>
      </div>

      <div class="values">
        <div class="field">
          <span class="label">Hex</span>
          <input class="value" id="hexValue" value="#FF0000" readonly />
        </div>
        <div class="field">
          <span class="label">RGB</span>
          <input class="value" id="rgbValue" value="255, 0, 0" readonly />
        </div>
        <div class="field">
          <span class="label">Vector3 normalizado</span>
          <input class="value" id="vectorValueSmall" value="(1.000, 0.000, 0.000)" readonly />
        </div>
      </div>
    </section>

    <section class="vector-box">
      <span class="label">Vector3</span>
      <div class="vector-line">
        <input class="value vector-input" id="vectorInput" value="1.000, 0.000, 0.000" spellcheck="false" aria-label="Digite os valores do Vector3" />
      </div>
      <div class="vector-line result-line">
        <code class="vector" id="vectorValue">new Vector3(1.000, 0.000, 0.000)</code>
        <button id="copyButton" type="button">Copiar</button>
      </div>
      <div class="input-hint">Digite <code>x, y, z</code> ou <code>new Vector3(x, y, z)</code>. Valores esperados entre 0 e 1.</div>
    </section>

    <div class="footer">
      <span><span class="dot"></span>RGB normalizado</span>
      <span>0.000 → 1.000</span>
    </div>
  </main>

<script>
  const colorPicker = document.getElementById('colorPicker');
  const preview = document.getElementById('preview');
  const hexValue = document.getElementById('hexValue');
  const rgbValue = document.getElementById('rgbValue');
  const vectorValueSmall = document.getElementById('vectorValueSmall');
  const vectorValue = document.getElementById('vectorValue');
  const vectorInput = document.getElementById('vectorInput');
  const copyButton = document.getElementById('copyButton');

  function setColorFromRGB(r, g, b) {
    r = Math.max(0, Math.min(255, Math.round(r)));
    g = Math.max(0, Math.min(255, Math.round(g)));
    b = Math.max(0, Math.min(255, Math.round(b)));

    const hex = '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('').toUpperCase();
    colorPicker.value = hex;
    updateColor();
  }

  function updateColor() {
    const hex = colorPicker.value.toUpperCase();
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);

    const x = r / 255;
    const y = g / 255;
    const z = b / 255;

    const vector = `new Vector3(${x.toFixed(3)}, ${y.toFixed(3)}, ${z.toFixed(3)})`;

    preview.style.backgroundColor = hex;
    hexValue.value = hex;
    rgbValue.value = `${r}, ${g}, ${b}`;
    vectorValueSmall.value = `(${x.toFixed(3)}, ${y.toFixed(3)}, ${z.toFixed(3)})`;
    vectorValue.textContent = vector;

    if (document.activeElement !== vectorInput) {
      vectorInput.value = `${x.toFixed(3)}, ${y.toFixed(3)}, ${z.toFixed(3)}`;
    }
  }

  function updateFromVector() {
    const raw = vectorInput.value
      .replace(/new\s*Vector3\s*\(/i, '')
      .replace(/[()]/g, '')
      .trim();

    const parts = raw.split(',').map(v => Number(v.trim()));

    if (parts.length !== 3 || parts.some(v => !Number.isFinite(v))) {
      vectorInput.style.borderColor = '#d9534f';
      return;
    }

    vectorInput.style.borderColor = '';

    const [x, y, z] = parts.map(v => Math.max(0, Math.min(1, v)));
    vectorInput.value = `${x.toFixed(3)}, ${y.toFixed(3)}, ${z.toFixed(3)}`;
    setColorFromRGB(x * 255, y * 255, z * 255);
  }

  colorPicker.addEventListener('input', updateColor);
  vectorInput.addEventListener('input', updateFromVector);
  vectorInput.addEventListener('blur', () => {
    if (vectorInput.value.trim() === '') updateColor();
  });

  copyButton.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(vectorValue.textContent);
      const oldText = copyButton.textContent;
      copyButton.textContent = 'Copiado!';
      setTimeout(() => copyButton.textContent = oldText, 1000);
    } catch {
      const range = document.createRange();
      range.selectNodeContents(vectorValue);
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
      document.execCommand('copy');
      selection.removeAllRanges();
      copyButton.textContent = 'Copiado!';
      setTimeout(() => copyButton.textContent = 'Copiar', 1000);
    }
  });

  updateColor();
</script>
</body>
</html>
